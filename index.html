<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Payment Tracker - JsonBin Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .content {
            padding: 30px;
        }
        .status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .stat-label { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #333; }
        .section { margin-bottom: 40px; }
        .section h2 { font-size: 20px; margin-bottom: 20px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        tr:hover { background: #f8f9fa; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-paid { background: #d4edda; color: #155724; }
        .status-partial { background: #fff3cd; color: #856404; }
        .status-unpaid { background: #f8d7da; color: #721c24; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input { flex: 1; }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #764ba2; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 BG Payment Tracker</h1>
            <p>Cloud-based Invoice & Bank Guarantee Management</p>
        </div>
        <div class="content" id="app">
            <div class="loading">Loading data from JsonBin cloud...</div>
        </div>
        <div class="footer">
            ✓ All data is saved to JsonBin cloud storage | No login required | Auto-sync enabled
        </div>
    </div>

    <script>
        const JSONBIN_API_URL = 'https://api.jsonbin.io/v3';
        const MASTER_KEY = 'YOUR_JSONBIN_MASTER_KEY_HERE'; // Replace with your actual key

        const INITIAL_INVOICES = [
            { id: 1, date: "2026-04-16", invoiceNo: "GJ0160003495", company: "HPCL", terminal: "HPCL PIPAVAV", qty: 35.52, netAmt: 3530382.52, dueDate: "2026-05-16", paidDate: null, paidAmt: 0, status: "unpaid" },
            { id: 2, date: "2026-04-16", invoiceNo: "GJ0160003460", company: "HPCL", terminal: "HPCL PIPAVAV", qty: 31.30, netAmt: 3110950.82, dueDate: "2026-05-16", paidDate: null, paidAmt: 0, status: "unpaid" },
            { id: 3, date: "2026-04-27", invoiceNo: "GJ0160006771", company: "HPCL", terminal: "HPCL PIPAVAV", qty: 22.12, netAmt: 2198537.76, dueDate: "2026-05-27", paidDate: null, paidAmt: 0, status: "unpaid" },
            { id: 4, date: "2026-04-27", invoiceNo: "GJ0160006797", company: "HPCL", terminal: "HPCL PIPAVAV", qty: 35.45, netAmt: 3523425.14, dueDate: "2026-05-27", paidDate: null, paidAmt: 0, status: "unpaid" },
            { id: 5, date: "2026-04-27", invoiceNo: "GJ0160006752", company: "HPCL", terminal: "HPCL PIPAVAV", qty: 23.17, netAmt: 2302898.74, dueDate: "2026-05-27", paidDate: null, paidAmt: 0, status: "unpaid" },
        ];

        const INITIAL_BGS = [
            { id: 1, company: "HPCL", bgNo: "HPCL-BG-2CR", bgAmount: 20000000, marginPct: 15, marginAmt: 3000000, commissionPct: 0.8, bgStartDate: "2026-05-07", bgEndDate: "2026-06-30", bankName: "ICICI Bank - Himatnagar", stampDuty: 300, bgRefNo: "N/A", claimExpiry: "2026-09-30" },
            { id: 2, company: "HPCL", bgNo: "0452NDLG00001127", bgAmount: 40000000, marginPct: 15, marginAmt: 6000000, commissionPct: 0.8, bgStartDate: "2026-04-24", bgEndDate: "2026-06-30", bankName: "ICICI Bank - Himatnagar", stampDuty: 300, bgRefNo: "0452NDLG00001127", claimExpiry: "2026-06-30" },
        ];

        let state = {
            invoices: INITIAL_INVOICES,
            bgs: INITIAL_BGS,
            paymentHistory: [],
            binId: null
        };

        async function getOrCreateBinId() {
            let binId = localStorage.getItem('tracker_bin_id');
            if (binId) return binId;

            try {
                const res = await fetch(`${JSONBIN_API_URL}/b`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY,
                    },
                    body: JSON.stringify({
                        invoices: INITIAL_INVOICES,
                        bgs: INITIAL_BGS,
                        paymentHistory: [],
                        lastUpdated: Date.now(),
                    }),
                });

                if (!res.ok) throw new Error('Failed to create bin');
                const data = await res.json();
                binId = data.metadata.id;
                localStorage.setItem('tracker_bin_id', binId);
                return binId;
            } catch (err) {
                console.error('Error creating bin:', err);
                throw err;
            }
        }

        async function loadData(binId) {
            const res = await fetch(`${JSONBIN_API_URL}/b/${binId}`, {
                method: 'GET',
                headers: { 'X-Master-Key': MASTER_KEY },
            });

            if (!res.ok) throw new Error('Failed to load data');
            const data = await res.json();
            return data.record;
        }

        async function saveData(binId, data) {
            const res = await fetch(`${JSONBIN_API_URL}/b/${binId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY,
                },
                body: JSON.stringify(data),
            });

            if (!res.ok) throw new Error('Failed to save data');
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 0,
            }).format(amount);
        }

        function renderApp() {
            const totalOutstanding = state.invoices.reduce((sum, inv) => sum + (inv.netAmt - (inv.paidAmt || 0)), 0);
            const totalBG = state.bgs.reduce((sum, bg) => sum + bg.bgAmount, 0);
            const totalPaid = state.invoices.reduce((sum, inv) => sum + (inv.paidAmt || 0), 0);

            const html = `
                <div class="status">
                    <div class="stat-card">
                        <div class="stat-label">Total Outstanding</div>
                        <div class="stat-value">${formatCurrency(totalOutstanding)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Paid</div>
                        <div class="stat-value">${formatCurrency(totalPaid)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total BG Amount</div>
                        <div class="stat-value">${formatCurrency(totalBG)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Invoices Count</div>
                        <div class="stat-value">${state.invoices.length}</div>
                    </div>
                </div>

                <div class="section">
                    <h2>📋 Invoices</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Invoice No</th>
                                <th>Company</th>
                                <th>Terminal</th>
                                <th>Net Amount</th>
                                <th>Paid</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${state.invoices.map(inv => `
                                <tr>
                                    <td>${inv.invoiceNo}</td>
                                    <td>${inv.company}</td>
                                    <td>${inv.terminal}</td>
                                    <td>${formatCurrency(inv.netAmt)}</td>
                                    <td>${formatCurrency(inv.paidAmt || 0)}</td>
                                    <td><span class="status-badge status-${inv.status}">${inv.status.toUpperCase()}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <h2>🏦 Bank Guarantees</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Company</th>
                                <th>BG No</th>
                                <th>Amount</th>
                                <th>Margin</th>
                                <th>Valid Till</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${state.bgs.map(bg => `
                                <tr>
                                    <td>${bg.company}</td>
                                    <td>${bg.bgNo}</td>
                                    <td>${formatCurrency(bg.bgAmount)}</td>
                                    <td>${formatCurrency(bg.marginAmt)}</td>
                                    <td>${bg.bgEndDate}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <h2>💳 Record Payment</h2>
                    <div class="input-group">
                        <input type="number" id="paymentAmount" placeholder="Enter amount in rupees" />
                        <button onclick="recordPayment()">Record Payment</button>
                    </div>
                </div>

                <div class="section">
                    <h2>📊 Payment History (${state.paymentHistory.length})</h2>
                    ${state.paymentHistory.length === 0 ? '<p style="color: #666;">No payments recorded yet</p>' : `
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Company</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${state.paymentHistory.map(payment => `
                                    <tr>
                                        <td>${payment.date}</td>
                                        <td>${payment.company}</td>
                                        <td>${formatCurrency(payment.amount)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `}
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        async function recordPayment() {
            const amount = parseFloat(document.getElementById('paymentAmount').value);
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            state.paymentHistory.push({
                date: new Date().toISOString().split('T')[0],
                company: 'HPCL',
                amount: amount
            });

            // Allocate payment to invoices
            let remaining = amount;
            for (let inv of state.invoices) {
                if (remaining <= 0) break;
                const pending = inv.netAmt - (inv.paidAmt || 0);
                if (pending > 0) {
                    const applied = Math.min(pending, remaining);
                    inv.paidAmt = (inv.paidAmt || 0) + applied;
                    inv.status = inv.paidAmt >= inv.netAmt - 0.01 ? 'paid' : 'partial';
                    remaining -= applied;
                }
            }

            await saveData(state.binId, state);
            document.getElementById('paymentAmount').value = '';
            renderApp();
        }

        async function init() {
            try {
                state.binId = await getOrCreateBinId();
                const data = await loadData(state.binId);
                if (data) {
                    state = { ...state, ...data };
                }
                renderApp();
            } catch (err) {
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${err.message}<br>
                        <small>Make sure your JsonBin Master Key is configured correctly in the HTML file.</small>
                    </div>
                    <div style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 6px;">
                        <p><strong>To fix this:</strong></p>
                        <ol style="margin-left: 20px; margin-top: 10px;">
                            <li>Go to <a href="https://jsonbin.io/dashboard" target="_blank">JsonBin Dashboard</a></li>
                            <li>Copy your Master Key</li>
                            <li>Replace 'YOUR_JSONBIN_MASTER_KEY_HERE' in this HTML file with your actual key</li>
                            <li>Save and reload this page</li>
                        </ol>
                    </div>
                `;
            }
        }

        init();
    </script>
</body>
</html>
